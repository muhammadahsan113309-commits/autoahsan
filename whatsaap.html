<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto WhatsApp Launcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md glass p-6 sm:p-8 rounded-2xl shadow-2xl space-y-6">
    <div class="flex items-center space-x-3">
      <div class="p-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <i data-lucide="bot" class="w-6 h-6"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white">WhatsApp Auto-Sender</h2>
        <p class="text-xs text-slate-400">Triggers Python backend to open & send</p>
      </div>
    </div>

    <form id="wa-form" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Phone Number (with Country Code)</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">+</span>
          <input type="tel" id="phone" required placeholder="923001234567" class="w-full pl-8 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Message</label>
        <textarea id="message" rows="4" required placeholder="Type your message..." class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-emerald-500 resize-none"></textarea>
      </div>

      <button type="submit" id="send-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-white font-semibold text-sm shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2">
        <i data-lucide="send" class="w-4 h-4"></i>
        <span>Trigger Auto Send</span>
      </button>
    </form>

    <div id="status" class="text-xs text-center hidden"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      document.getElementById("wa-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const btn = document.getElementById("send-btn");
        const status = document.getElementById("status");
        let phone = document.getElementById("phone").value.replace(/[^0-9]/g, '');
        const message = document.getElementById("message").value;

        btn.disabled = true;
        btn.innerText = "Opening WhatsApp & Sending...";
        status.innerText = "Sending command to local Python server...";
        status.className = "text-xs text-center text-amber-400";
        status.classList.remove("hidden");

        try {
          // Send request to Python server running on your laptop
          const res = await fetch("http://localhost:5000/send-whatsapp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, message })
          });

          const data = await res.json();

          if (res.ok) {
            status.innerText = "WhatsApp opened and message sent!";
            status.className = "text-xs text-center text-emerald-400";
            document.getElementById("wa-form").reset();
          } else {
            status.innerText = "Server Error: " + data.message;
            status.className = "text-xs text-center text-rose-400";
          }
        } catch (err) {
          status.innerText = "Could not connect to Python script! Make sure 'python server.py' is running.";
          status.className = "text-xs text-center text-rose-400";
        } finally {
          btn.disabled = false;
          btn.innerText = "Trigger Auto Send";
        }
      });
    });
  </script>
</body>
</html>
